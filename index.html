<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что говорят твои зубы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column, one screen at a time — intro → 6 questions → result card */
:root{
  --bg:#EDF3EE; --card:#FFFFFF; --ink:#17352A; --muted:#5B7266;
  --accent:#2C8A57; --accent-ink:#FFFFFF; --lime:#D8EEA6; --line:#D3E0D6;
  --warn:#FFF1D6; --warn-ink:#7A4B00;
  --display:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1813; --card:#16241D; --ink:#E3EEE6; --muted:#9AB2A4;
  --accent:#5BC48A; --accent-ink:#0B1A12; --lime:#34502A; --line:#2A3D33;
  --warn:#3A2C12; --warn-ink:#F3D49A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1813; --card:#16241D; --ink:#E3EEE6; --muted:#9AB2A4;
  --accent:#5BC48A; --accent-ink:#0B1A12; --lime:#34502A; --line:#2A3D33;
  --warn:#3A2C12; --warn-ink:#F3D49A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:600 13px var(--body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
h1 mark{background:var(--lime);color:inherit;padding:0 .15em;border-radius:6px}
.lead{color:var(--muted);margin:0}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.btn{font:600 16px var(--body);border:0;border-radius:14px;padding:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.lang button:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0}
.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.progress span{height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.back{font:500 13px var(--body);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
.q{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:400 16px/1.4 var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt b{font-family:var(--display);font-size:13px;color:var(--accent);min-width:16px;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--lime)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.rname{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.rtext{margin:0}
.check{background:var(--lime);border-radius:14px;padding:14px 16px}
.check h3,.honest h3,.sub h3{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.check p,.honest p{margin:0}
.honest{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:14px 16px}
.sub{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sub h4{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.share{font-weight:500;margin:0;text-align:center}
.toast{font-size:13px;color:var(--accent);text-align:center;margin:0;min-height:20px}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease both}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#msgtext{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="brand" id="brand"></span>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button id="l-ru" type="button">RU</button>
      <button id="l-kz" type="button">ҚАЗ</button>
    </div>
  </div>
  <main id="app"></main>
</div>
